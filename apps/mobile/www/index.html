<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Music Room</title>
  <meta http-equiv="refresh" content="0; url=https://musicroom.witw.top/app">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background-color: #09090b; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .loader { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #0070f3; border-radius: 50%; animation: spin 1s linear infinite; }
    .text { margin-top: 16px; font-size: 14px; color: #a1a1aa; font-weight: 500; }
    .btn { display: none; margin-top: 16px; padding: 8px 20px; border-radius: 9999px; background: #0070f3; color: #ffffff; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn:active { opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="text" id="status-text">正在进入 Music Room...</div>
  <button class="btn" id="retry-btn" type="button">点击重试</button>
  <script>
    function openApp() {
      try {
        window.location.href = "https://musicroom.witw.top/app";
      } catch (err) {
        var status = document.getElementById("status-text");
        if (status) status.innerText = "网络连接受阻，请检查网络设置";
      }
    }
    openApp();
    setTimeout(function() {
      var btn = document.getElementById("retry-btn");
      if (btn) btn.style.display = "block";
    }, 4000);
    var retryBtn = document.getElementById("retry-btn");
    if (retryBtn) {
      retryBtn.addEventListener("click", openApp);
    }
  </script>
</body>
</html>
