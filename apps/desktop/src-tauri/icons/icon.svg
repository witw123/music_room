<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062ff" />
      <stop offset="50%" stop-color="#0051d4" />
      <stop offset="100%" stop-color="#003594" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#glowGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Music Note Icon with Glow -->
  <g transform="translate(136, 128) scale(10)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9 18V5l12-2v13" stroke="#ffffff" />
    <circle cx="6" cy="18" r="3" fill="#ffffff" />
    <circle cx="18" cy="16" r="3" fill="#ffffff" />
  </g>
</svg>
