[package]
name = "music-room-desktop"
version = "0.3.1"
description = "Music Room Desktop Shell"
authors = ["Music Room Team"]
edition = "2021"

[lib]
name = "music_room_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# System media controls: macOS Now Playing / Linux MPRIS. Windows uses
# WebView2's own SMTC integration driven by the page's Media Session API.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
