[package]
name = "music-room-desktop"
version = "0.3.1"
description = "Music Room Desktop Shell"
authors = ["Music Room Team"]
edition = "2021"

[lib]
name = "music_room_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for transparent windows on macOS; the flag is
# inert on Windows/Linux builds.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
