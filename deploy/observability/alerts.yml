groups:
  - name: soqaro
    rules:
      - alert: SoqaroServerDown
        expr: up{job="soqaro-server"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Soqaro server is down" }
      - alert: SoqaroDependencyDegraded
        expr: soqaro_prisma_available == 0 or soqaro_redis_available == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Soqaro dependency is unavailable" }
      - alert: SoqaroRealtimeFailures
        expr: increase(soqaro_realtime_failures_total[5m]) > 5
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Realtime failures increased" }
      - alert: SoqaroDiagnosticsRateLimited
        expr: rate(soqaro_diagnostics_rate_limited_total[5m]) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Diagnostics reports are being rate limited" }
