services:
  redis-master:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --masterauth
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_master_data:/data

  redis-replica-1:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      - redis-master
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --masterauth
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_replica_1_data:/data

  redis-replica-2:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      - redis-master
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --replicaof
      - redis-master
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --masterauth
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_replica_2_data:/data

  redis-sentinel-1:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD must be set}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:?REDIS_SENTINEL_MASTER_NAME must be set}
    command:
      - /bin/sh
      - -ec
      - |
        {
          printf '%s\n' 'port 26379'
          printf 'requirepass %s\n' "$$REDIS_SENTINEL_PASSWORD"
          printf 'sentinel monitor %s redis-master 6379 2\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel auth-pass %s %s\n' "$$REDIS_SENTINEL_MASTER_NAME" "$$REDIS_PASSWORD"
          printf 'sentinel down-after-milliseconds %s 5000\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel failover-timeout %s 10000\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel parallel-syncs %s 1\n' "$$REDIS_SENTINEL_MASTER_NAME"
        } > /etc/redis/sentinel.conf
        exec redis-server /etc/redis/sentinel.conf --sentinel

  redis-sentinel-2:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD must be set}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:?REDIS_SENTINEL_MASTER_NAME must be set}
    command:
      - /bin/sh
      - -ec
      - |
        {
          printf '%s\n' 'port 26379'
          printf 'requirepass %s\n' "$$REDIS_SENTINEL_PASSWORD"
          printf 'sentinel monitor %s redis-master 6379 2\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel auth-pass %s %s\n' "$$REDIS_SENTINEL_MASTER_NAME" "$$REDIS_PASSWORD"
          printf 'sentinel down-after-milliseconds %s 5000\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel failover-timeout %s 10000\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel parallel-syncs %s 1\n' "$$REDIS_SENTINEL_MASTER_NAME"
        } > /etc/redis/sentinel.conf
        exec redis-server /etc/redis/sentinel.conf --sentinel

  redis-sentinel-3:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD must be set}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:?REDIS_SENTINEL_MASTER_NAME must be set}
    command:
      - /bin/sh
      - -ec
      - |
        {
          printf '%s\n' 'port 26379'
          printf 'requirepass %s\n' "$$REDIS_SENTINEL_PASSWORD"
          printf 'sentinel monitor %s redis-master 6379 2\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel auth-pass %s %s\n' "$$REDIS_SENTINEL_MASTER_NAME" "$$REDIS_PASSWORD"
          printf 'sentinel down-after-milliseconds %s 5000\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel failover-timeout %s 10000\n' "$$REDIS_SENTINEL_MASTER_NAME"
          printf 'sentinel parallel-syncs %s 1\n' "$$REDIS_SENTINEL_MASTER_NAME"
        } > /etc/redis/sentinel.conf
        exec redis-server /etc/redis/sentinel.conf --sentinel

volumes:
  redis_master_data:
  redis_replica_1_data:
  redis_replica_2_data:
