upstream music_room_web {
  server web:3000;
}

upstream music_room_server {
  server server:3001;
}

limit_req_zone $binary_remote_addr zone=music_room_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=music_room_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=music_room_admin:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=music_room_connections:10m;

# 压缩 API JSON 与前端文本资源(Next standalone 自带 gzip 的响应会被自动跳过,
# 这里主要覆盖 NestJS API 与未压缩上游)。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/wasm
  image/svg+xml
  text/css
  text/plain;

# HTTP to HTTPS redirect.
server {
  listen 80;
  server_name ${APP_DOMAIN};
  server_tokens off;
  client_max_body_size 2m;
  return 301 https://$$host$$request_uri;
}

server {
  listen 443 ssl;
  server_name ${APP_DOMAIN};
  server_tokens off;
  client_max_body_size 2m;

  ssl_certificate     /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  include music-room.routes.conf;
}
