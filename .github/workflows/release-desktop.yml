name: Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: |
          pnpm --filter @music-room/shared build
          pnpm --filter @music-room/web build

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/desktop/src-tauri'
          tagName: ${{ github.ref_name }}
          releaseName: 'Music Room ${{ github.ref_name }}'
          releaseBody: 'Music Room 多平台客户端构建版本。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Deliberately no `android-actions/setup-android` here. It unconditionally
      # runs `sdkmanager tools`, and that legacy package is no longer published,
      # so the action dies on the current ubuntu-24.04 image (which ships
      # cmdline-tools 16.0) with "Failed to find package 'tools'". The runner
      # image already provides the SDK at /usr/local/lib/android/sdk together
      # with ANDROID_HOME / ANDROID_SDK_ROOT, and Gradle downloads any missing
      # component on demand because the licences below are accepted.
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor Android
        run: |
          cd apps/mobile
          npx cap sync android

      # The upload key lives in a repository secret, base64-encoded, so nothing
      # signed-in is ever checked in. See docs/deploy/android-release.md.
      - name: Decode Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少签名密钥。请在仓库 Secrets 添加 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD，步骤见 docs/deploy/android-release.md。未配置时不再回退到 debug 包——debug APK 无法作为正式发布件。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/music-room-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/music-room-release.jks" >> "$GITHUB_ENV"

      - name: Resolve app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          APK_FILE=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_FILE" release-apk/MusicRoom-Android-${{ github.ref_name }}.apk

      - name: Upload Android APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} release-apk/MusicRoom-Android-${{ github.ref_name }}.apk --clobber || \
          gh release create ${{ github.ref_name }} release-apk/MusicRoom-Android-${{ github.ref_name }}.apk --title "Music Room ${{ github.ref_name }}" --notes "Music Room 多平台客户端构建版本。"


